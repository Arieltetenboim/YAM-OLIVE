<style>
  :root {
    --olive-950: #1e2e1a;
    --olive-800: #2f4529;
    --olive-700: #3f5c36;
    --olive-600: #527848;
    --olive-500: #6b9458;
    --olive-200: #d5e4ce;
    --olive-100: #e8f0e4;
    --oil-600: #a67c2d;
    --oil-500: #c4923a;
    --oil-100: #f7edd8;
    --sand-50: #f6f3ec;
    --sand-100: #efe9dc;
    --ink: #1a2218;
    --muted: #5c6b56;
    --line: #d2ddd0;
    --danger: #9b3b2e;
    --danger-soft: #f8e6e3;
    --ok: #2f6b3a;
    --ok-soft: #e3f2e6;
    --card: #ffffff;
    --shadow: 0 10px 30px rgba(30, 46, 26, 0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --nav-h: 68px;
    --font: "Heebo", "Assistant", "Segoe UI", Tahoma, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(196, 146, 58, 0.16), transparent 55%),
      radial-gradient(900px 500px at -10% 20%, rgba(107, 148, 88, 0.18), transparent 50%),
      linear-gradient(180deg, var(--sand-50), #f3efe6 40%, var(--olive-100));
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    direction: rtl;
  }

  button, input, select, textarea {
    font: inherit;
    direction: rtl;
  }

  button {
    cursor: pointer;
    border: none;
    background: none;
  }

  a { color: var(--olive-700); }

  .app-shell {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px 16px calc(var(--nav-h) + 28px);
  }

  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand-name {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--olive-800);
    margin: 0;
  }

  .brand-sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.72);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .chip.ok {
    background: var(--ok-soft);
    border-color: #b7d8bc;
    color: var(--ok);
  }

  .panel {
    background: var(--card);
    border: 1px solid rgba(210, 221, 208, 0.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 16px;
  }

  .panel h2, .panel h3 {
    margin: 0 0 12px;
    color: var(--olive-800);
  }

  .panel h2 { font-size: 1.2rem; }
  .panel h3 { font-size: 1.05rem; }

  .muted { color: var(--muted); }
  .small { font-size: 0.9rem; }

  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .row > * { min-width: 0; }
  .grow { flex: 1 1 auto; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--olive-800);
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: #fcfbf8;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    min-height: 48px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field textarea { min-height: 88px; resize: vertical; }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--olive-500);
    box-shadow: 0 0 0 3px rgba(107, 148, 88, 0.18);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 12px 18px;
    border-radius: 14px;
    font-weight: 700;
    transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, var(--olive-700), var(--olive-600));
    color: #fff;
  }

  .btn-secondary {
    background: var(--olive-100);
    color: var(--olive-800);
    border: 1px solid var(--olive-200);
  }

  .btn-oil {
    background: linear-gradient(135deg, var(--oil-600), var(--oil-500));
    color: #fff;
  }

  .btn-danger {
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid #efc4bd;
  }

  .btn-ghost {
    background: transparent;
    color: var(--olive-700);
    border: 1px dashed var(--line);
  }

  .btn-block { width: 100%; }
  .btn-lg { min-height: 56px; font-size: 1.08rem; }

  .net-hero {
    background:
      linear-gradient(145deg, rgba(63, 92, 54, 0.95), rgba(82, 120, 72, 0.92)),
      radial-gradient(circle at 20% 20%, rgba(196, 146, 58, 0.25), transparent 50%);
    color: #fff;
    border-radius: var(--radius);
    padding: 18px 16px;
    text-align: center;
    margin: 4px 0 8px;
  }

  .net-hero .label {
    opacity: 0.9;
    font-size: 0.95rem;
    margin-bottom: 4px;
  }

  .net-hero .value {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .net-hero .unit {
    font-size: 1rem;
    opacity: 0.85;
    margin-right: 6px;
  }

  .season-banner {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .season-banner strong { color: var(--olive-800); }

  .totals-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .stat-tile {
    background: var(--sand-50);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
  }

  .stat-tile .k {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 4px;
  }

  .stat-tile .v {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--olive-800);
  }

  .record-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    background: #fff;
  }

  .record-card + .record-card { margin-top: 10px; }

  .record-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
  }

  .record-meta {
    color: var(--muted);
    font-size: 0.86rem;
  }

  .record-net {
    font-weight: 800;
    color: var(--olive-700);
    font-size: 1.1rem;
  }

  .record-details {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: none;
  }

  .record-card.open .record-details { display: block; }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--oil-100);
    color: var(--oil-600);
    font-size: 0.75rem;
    font-weight: 700;
  }

  details.advanced {
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 8px 12px;
    background: #fbfaf7;
  }

  details.advanced summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--olive-700);
    padding: 8px 0;
    list-style: none;
  }

  details.advanced summary::-webkit-details-marker { display: none; }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    z-index: 40;
  }

  .nav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.92rem;
  }

  .nav button.active {
    color: var(--olive-700);
  }

  .nav .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: transparent;
  }

  .nav button.active .dot {
    background: var(--olive-600);
  }

  .page { display: none; }
  .page.active { display: block; }

  .setup-wrap {
    max-width: 560px;
    margin: 8vh auto 0;
    padding: 16px;
  }

  .setup-hero {
    text-align: center;
    margin-bottom: 22px;
  }

  .setup-hero h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--olive-800);
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-120%);
    background: var(--olive-800);
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    z-index: 100;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: var(--shadow);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.error { background: var(--danger); }
  .toast.success { background: var(--ok); }

  .empty {
    text-align: center;
    padding: 24px 12px;
    color: var(--muted);
  }

  .list-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .list-item:last-child { border-bottom: none; }

  .chart-box {
    position: relative;
    height: 240px;
    margin-top: 8px;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(246, 243, 236, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 90;
  }

  .loading-overlay.show { display: flex; }

  .spinner {
    width: 42px;
    height: 42px;
    border: 3px solid var(--olive-200);
    border-top-color: var(--olive-600);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  @media (min-width: 720px) {
    .app-shell { padding-top: 24px; }
    .kpi-grid, .totals-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26, 34, 24, 0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 80;
    padding: 16px;
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    width: min(560px, 100%);
    background: #fff;
    border-radius: 20px 20px 16px 16px;
    padding: 18px;
    max-height: 85vh;
    overflow: auto;
  }

  .modal h3 { margin-top: 0; }
</style>
